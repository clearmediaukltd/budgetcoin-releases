<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download BudgetCoin</title>
<style>
  :root { --bg: #f5f6f8; --surface: #fff; --text: #14181f; --muted: #5b6472; --accent: #2f5bea; --border: #e3e6eb; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161b24; --surface: #1d2430; --text: #d5dbe4; --muted: #8f9aab; --accent: #6f8ff0; --border: #2c3544; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a.btn { display: inline-block; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
  a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  small { display: block; margin-top: 18px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>BudgetCoin</h1>
    <p>Every coin, on purpose.</p>
    <a class="btn" href="https://github.com/clearmediaukltd/budgetcoin-releases/releases/latest">Download the latest version</a>
    <small>Pick the installer for your computer under Assets. Installing it over your current version keeps your budgets.</small>
  </div>
</main>
</body>
</html>
